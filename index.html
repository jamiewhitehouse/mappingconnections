#choice2{ top:10%; right:10%; }
#choice3{ bottom:10%; left:10%; }

/* feedback */

position:absolute;
top:40%;
right:-8px;
font-size:2.5em;
}

/* flash animations */

.correctFlash{
animation: correctFlash 1s;
}

.incorrectFlash{
animation: incorrectFlash 1s;
}

@keyframes correctFlash{
0%{background:transparent;}
50%{background:#053d1c;}
100%{background:transparent;}
}

@keyframes incorrectFlash{
0%{background:transparent;}
50%{background:#9d291c;}
100%{background:transparent;}
}

const originalImageHeight = 10705;

/* scroll navigation */

function scrollToImagePixel(pixel){

const img = document.querySelector(".content img");

const scale = img.clientHeight / originalImageHeight;

const scrollPosition = img.offsetTop + (pixel * scale);

window.scrollTo({
top: scrollPosition,
behavior: "smooth"
});

}

<!-- ODD ONE OUT SCRIPT -->

<script>

/* (unchanged JS) */

const trials = [

{
images:[
"images/mts/same5a.jpg",
"images/mts/same5b.jpg",
"images/mts/same5c.jpg",
"images/mts/diff5.jpg"
],
correct:3
},

{
images:[
"images/mts/same6a.jpg",
"images/mts/diff6.jpg",
"images/mts/same6b.jpg",
"images/mts/same6c.jpg"
],
correct:1
},

{
images:[
"images/mts/same7a.jpg",
"images/mts/same7b.jpg",
"images/mts/diff7.jpg",
"images/mts/same7c.jpg"
],
correct:2
},

{
images:[
"images/mts/diff8.jpg",
"images/mts/same8a.jpg",
"images/mts/same8b.jpg",
"images/mts/same8c.jpg"
],
correct:0
},

{
images:[
"images/mts/same1a.jpg",
"images/mts/same1b.jpg",
"images/mts/same1c.jpg",
"images/mts/diff1.jpg"
],
correct:3
},

{
images:[
"images/mts/diff2.jpg",
"images/mts/same2a.jpg",
"images/mts/same2b.jpg",
"images/mts/same2c.jpg"
],
correct:0
},

{
images:[
"images/mts/same3a.jpg",
"images/mts/same3b.jpg",
"images/mts/diff3.jpg",
"images/mts/same3c.jpg"
],
correct:2
},

{
images:[
"images/mts/same4a.jpg",
"images/mts/diff4.jpg",
"images/mts/same4b.jpg",
"images/mts/same4c.jpg"
],
correct:1
}

]

let trialIndex = 0

const choices = [
document.getElementById("choice1"),
document.getElementById("choice2"),
document.getElementById("choice3"),
document.getElementById("choice4")
]

const feedback = document.getElementById("feedback")

function loadTrial(){
let trial = trials[trialIndex]
let order = [0,1,2,3].sort(()=>Math.random()-0.5)

choices.forEach((img,i)=>{
let imageIndex = order[i]
img.src = trial.images[imageIndex]

if(imageIndex === trial.correct){
img.dataset.correct = "true"
}else{
img.dataset.correct = "false"
}

img.classList.remove("correctFlash","incorrectFlash")
})

feedback.innerHTML = ""
}

function choose(e){
let correct = e.target.dataset.correct === "true"

if(correct){
e.target.classList.add("correctFlash")
feedback.innerHTML = "✓"
feedback.className = "correctSymbol"
}
else{
e.target.classList.add("incorrectFlash")
feedback.innerHTML = "✗"
feedback.className = "incorrectSymbol"
}

setTimeout(nextTrial,800)
}

function nextTrial(){
trialIndex++
if(trialIndex >= trials.length){
trialIndex = 0
}
loadTrial()
}

choices.forEach(img=>{
img.onclick = choose
})

loadTrial()

</script>
